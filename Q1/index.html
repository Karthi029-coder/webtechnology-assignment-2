<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-shape s1"></div>
<div class="bg-shape s2"></div>

<header class="topbar">
  <div class="brand"><span class="logo">SR</span> Student Registration Portal</div>
  <nav>
    <a href="index.html" class="active">Register</a>
    <a href="list.html">Registrations</a>
  </nav>
</header>

<main class="card">
  <div class="card-head">
    <h1>Create Your Admission Profile</h1>
    <p>Fill in your details below to register.</p>
  </div>

  <form id="registrationForm" novalidate>
    <div class="field">
      <label for="name">Student Name</label>
      <input type="text" id="name" placeholder="Enter full name">
      <span class="error" id="nameError"></span>
    </div>

    <div class="row">
      <div class="field">
        <label for="roll">Roll Number</label>
        <input type="text" id="roll" placeholder="e.g. 24CS091">
        <span class="error" id="rollError"></span>
      </div>
      <div class="field">
        <label for="course">Course</label>
        <select id="course">
          <option value="">Select Course</option>
          <option value="CSE">Computer Science (CSE)</option>
          <option value="IT">Information Technology (IT)</option>
          <option value="ECE">Electronics (ECE)</option>
          <option value="EEE">Electrical (EEE)</option>
          <option value="MECH">Mechanical</option>
        </select>
        <span class="error" id="courseError"></span>
      </div>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="name@example.com">
      <span class="error" id="emailError"></span>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimum 8 characters">
      <div class="strength"><div id="strengthBar"></div></div>
      <small id="strengthText"></small>
      <span class="error" id="passwordError"></span>
    </div>

    <div class="field">
      <label for="document">Upload Student Document</label>
      <input type="file" id="document" accept=".pdf,.jpg,.jpeg,.png">
      <span class="error" id="documentError"></span>
    </div>

    <button type="submit" class="btn">Register Student</button>
    <p id="success"></p>
  </form>

  <a class="btn ghost" href="list.html">View Registration List</a>
</main>

<footer>Student Registration Portal | 2026</footer>
<script src="script.js"></script>
</body>
</html>
